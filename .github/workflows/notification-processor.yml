name: Process task notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: flowdesk-notification-processor
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke protected notification processor
        env:
          FLOWDESK_URL: ${{ secrets.FLOWDESK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$FLOWDESK_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --retry 2 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${FLOWDESK_URL%/}/api/notifications/process"
